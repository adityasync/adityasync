<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="brickTile" width="120" height="60" patternUnits="userSpaceOnUse">
      <rect width="120" height="60" fill="#0A0A0A"/>
      <rect x="2" y="2" width="56" height="56" rx="4" fill="#141414"/>
      <rect x="62" y="2" width="56" height="56" rx="4" fill="#141414"/>
      <circle cx="30" cy="16" r="8" fill="#1C1C1C"/>
      <circle cx="90" cy="16" r="8" fill="#1C1C1C"/>
    </pattern>

    <radialGradient id="studShine" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#FFC300"/>
      <stop offset="100%" stop-color="#E0A800"/>
    </radialGradient>

    <linearGradient id="plateBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FFC300"/>
    </linearGradient>

    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- brick wall backdrop -->
  <rect width="1200" height="300" fill="#0A0A0A"/>
  <rect width="1200" height="300" fill="url(#brickTile)"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>
  <rect x="3" y="3" width="1194" height="294" fill="none" stroke="#FFC300" stroke-width="3" opacity="0.5"/>

  <!-- raised yellow name-plate brick -->
  <g>
    <rect x="55" y="70" width="640" height="160" rx="10" fill="#000000" opacity="0.5" transform="translate(6,8)"/>
    <rect x="55" y="70" width="640" height="160" rx="10" fill="url(#plateBody)" stroke="#000000" stroke-width="4"/>

    <!-- studs on top of the plate -->
    <circle cx="100" cy="70" r="17" fill="url(#studShine)" stroke="#000000" stroke-width="3"/>
    <circle cx="160" cy="70" r="17" fill="url(#studShine)" stroke="#000000" stroke-width="3"/>
    <circle cx="220" cy="70" r="17" fill="url(#studShine)" stroke="#000000" stroke-width="3"/>
    <circle cx="280" cy="70" r="17" fill="url(#studShine)" stroke="#000000" stroke-width="3"/>
    <circle cx="340" cy="70" r="17" fill="url(#studShine)" stroke="#000000" stroke-width="3"/>
    <circle cx="400" cy="70" r="17" fill="url(#studShine)" stroke="#000000" stroke-width="3"/>
    <circle cx="460" cy="70" r="17" fill="url(#studShine)" stroke="#000000" stroke-width="3"/>
    <circle cx="520" cy="70" r="17" fill="url(#studShine)" stroke="#000000" stroke-width="3"/>
    <circle cx="580" cy="70" r="17" fill="url(#studShine)" stroke="#000000" stroke-width="3"/>
    <circle cx="640" cy="70" r="17" fill="url(#studShine)" stroke="#000000" stroke-width="3"/>

    <text x="90" y="165" font-family="JetBrains Mono, monospace" font-size="52" font-weight="700" fill="#000000">ADITYA</text>
    <text x="90" y="200" font-family="JetBrains Mono, monospace" font-size="19" fill="#000000" opacity="0.8">$ whoami --engineer --systems --tech-noir</text>
    <text x="90" y="222" font-family="JetBrains Mono, monospace" font-size="14" fill="#000000" opacity="0.6">computer engineering · data science minor · full-stack &amp; systems</text>
  </g>

  <!-- small black 2x2 brick accent, bottom right -->
  <g transform="translate(1015,225)">
    <rect width="130" height="60" rx="8" fill="#000000" stroke="#FFC300" stroke-width="3"/>
    <circle cx="35" cy="0" r="12" fill="#000000" stroke="#FFC300" stroke-width="3"/>
    <circle cx="95" cy="0" r="12" fill="#000000" stroke="#FFC300" stroke-width="3"/>
    <text x="65" y="38" font-family="JetBrains Mono, monospace" font-size="14" fill="#FFC300" text-anchor="middle">mumbai</text>
  </g>
</svg>
